<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact US</title>
    <link rel="stylesheet" href="contact.css">
    <!-- Updated Font Awesome CDN to v6.5.1 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>

  <section class="contact-section">
    <div class="contact-container">
      
      <!-- Header container for same-line alignment -->
      <div class="contact-header">
        <a class="privacy-icon" href="http://127.0.0.1:5501/Ecommerce.html">
          <i class="fa-solid fa-arrow-left fa-beat fa-xl" style="color: rgb(22, 21, 21);"></i>
        </a>
        <h2>Contact Us</h2>
      </div>

      <p>Have questions? Send us a message and we will get back to you shortly.</p>

      <form class="contact-form">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" placeholder="Write your message..." required></textarea>
        </div>

        <button type="submit" class="submit-btn">Send Message</button>
      </form>
    </div>
  </section>
    
</body>
</html>
