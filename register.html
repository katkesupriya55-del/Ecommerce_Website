<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Shop Easy</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Ecommerce.css">
  <link rel="stylesheet" href="register.css">
</head>
<body>

  <nav class="navbar">
    
    <div class="user-actions"></div>
  </nav>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Create Account</h2>
        <p>Join <strong>Shop Easy</strong> to start exploring our collection</p>
      </div>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <div class="input-icon">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="fullName" placeholder="Enter your full name">
          </div>
          <small class="error-msg" id="nameError"></small>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-icon">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="email" placeholder="example@domain.com">
          </div>
          <small class="error-msg" id="emailError"></small>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-icon">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" placeholder="At least 6 characters">
          </div>
          <small class="error-msg" id="passwordError"></small>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <div class="input-icon">
            <i class="fa-solid fa-shield-halved"></i>
            <input type="password" id="confirmPassword" placeholder="Re-enter password">
          </div>
          <small class="error-msg" id="confirmPasswordError"></small>
        </div>

        <button type="submit" class="submit-btn">
          <span>Create Account</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <div class="auth-footer">
        <p>Already have an account? <a href="http://127.0.0.1:5501/Ecommerce.html">Sign In</a></p>
      </div>
    </div>
  </main>

  <script src="Ecommerce.js"></script>
  <script src="register.js"></script>
</body>
</html>
