<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Profile - Shop Easy</title>

  <!-- FontAwesome & Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="Ecommerce.css" />
  <style>
    .profile-container {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .profile-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }
    .profile-header {
      display: flex;
      align-items: center;
      gap: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid #e2e8f0;
    }
    .profile-avatar {
      width: 70px;
      height: 70px;
      background-color: #0f172a;
      color: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }
    .profile-title-box h2 {
      margin: 0;
      color: #0f172a;
    }
    .profile-title-box p {
      margin: 4px 0 0 0;
      color: #64748b;
    }
    .info-section {
      margin-top: 25px;
    }
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-top: 15px;
    }
    .info-box {
      background: #f8fafc;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #f1f5f9;
    }
    .info-box label {
      font-size: 0.8rem;
      color: #64748b;
      text-transform: uppercase;
      font-weight: 700;
      display: block;
      margin-bottom: 5px;
    }
    .info-box p {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      color: #1e293b;
    }
    .profile-actions {
      display: flex;
      gap: 15px;
      margin-top: 30px;
    }
    .btn-action {
      padding: 12px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      border: none;
    }
    .btn-shop {
      background: #0f172a;
      color: #fff;
    }
    .btn-logout {
      background: #fee2e2;
      color: #dc2626;
    }
    .btn-logout:hover {
      background: #fca5a5;
    }
  </style>
</head>
<body>

  <!-- Shared Navbar -->
  <nav class="navbar">
    <div class="first">
      <a href="Ecommerce.html"><img src="./ShopEasy...png" alt="Shop Easy Logo"></a>
    </div>

    <div class="nav-item">
      <a href="cart.html" class="icon-link">
        <i class="fa-solid fa-cart-shopping fa-xl" style="color: rgb(22, 21, 21);"></i>
        <span id="cart-count" class="badge">0</span>
      </a>
      <a href="wishlist.html" class="icon-link"> 
        <i class="fa-solid fa-heart fa-xl" style="color: rgb(22, 21, 21);"></i>
        <span id="wishlist-count" class="badge">0</span>
      </a>
    </div>
  </nav>

  <!-- Profile Content -->
  <main class="profile-container">
    <div class="profile-card">
      <div class="profile-header">
        <div class="profile-avatar">
          <i class="fa-solid fa-user"></i>
        </div>
        <div class="profile-title-box">
          <h2 id="profile-name">User Name</h2>
          <p id="profile-email">user@example.com</p>
        </div>
      </div>

      <div class="info-section">
        <h3>Account Information</h3>
        <div class="info-grid">
          <div class="info-box">
            <label><i class="fa-solid fa-phone"></i> Mobile Number</label>
            <p id="profile-mobile">N/A</p>
          </div>
          <div class="info-box">
            <label><i class="fa-solid fa-shield-halved"></i> Account Status</label>
            <p style="color: #22c55e;">Active Member</p>
          </div>
        </div>
      </div>

      <div class="info-section">
        <h3>Shipping Details</h3>
        <div class="info-box" style="margin-top: 15px;">
          <label><i class="fa-solid fa-location-dot"></i> Saved Address</label>
          <p id="profile-address">No address saved yet. Complete checkout to save an address.</p>
        </div>
      </div>

      <div class="profile-actions">
        <a href="Ecommerce.html" class="btn-action btn-shop">
          <i class="fa-solid fa-bag-shopping"></i> Continue Shopping
        </a>
        <button onclick="handleLogout()" class="btn-action btn-logout">
          <i class="fa-solid fa-right-from-bracket"></i> Logout
        </button>
      </div>
    </div>
  </main>

  <script src="Ecommerce.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Load Current User Details
      const currentUser = JSON.parse(localStorage.getItem('currentUser')) || {
        name: "Supriya",
        email: "supriya@example.com",
        mobile: "9876543210"
      };

      // Load Saved Shipping Address (if submitted from checkout page)
      const shippingData = JSON.parse(localStorage.getItem('shippingAddress'));

      // Populate UI
      document.getElementById('profile-name').innerText = currentUser.name || "User Profile";
      document.getElementById('profile-email').innerText = currentUser.email || "No email linked";
      document.getElementById('profile-mobile').innerText = currentUser.mobile || currentUser.phone || "N/A";

      if (shippingData) {
        document.getElementById('profile-address').innerText = 
          `${shippingData.address}, ${shippingData.city}, ${shippingData.state} - ${shippingData.pincode}`;
      }
    });
  </script>
</body>
</html>
