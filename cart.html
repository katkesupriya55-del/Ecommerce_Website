<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping Cart - ShopEasy</title>
  <link rel="stylesheet" href="product.css" />
  <link rel="stylesheet" href="Ecommerce.css">
  <link rel="stylesheet" href="cart.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>

  <header class="navbar">
    <a href="./product.html" class="brand-logo">
      <img src="./Ecommercel_logo.png" alt="ShopEasy Logo" onerror="this.src='https://via.placeholder.com/140x40?text=ShopEasy'">
    </a>
    <div class="nav-actions">
      <a href="./wishlist.html" class="nav-pill" aria-label="Wishlist">
        <i class="fa-regular fa-heart"></i>
        <span class="pill-label">Wishlist</span>
        <span class="count-badge">0</span>
      </a>
      <a href="./cart.html" class="nav-pill active-pill" aria-label="Cart">
        <i class="fa-solid fa-bag-shopping"></i>
        <span class="pill-label">Cart</span>
        <span class="count-badge highlight">0</span>
      </a>
    </div>
  </header>

  <div class="page-container">
    <header class="catalog-header">
      <h1 style="color: brown;">Your Shopping Cart</h1>
    </header>

    <div id="cart-content" class="cart-layout">
      <!-- Cart items section -->
      <div class="cart-items-list" id="cart-items-list">
        <!-- Dynamically rendered cart rows -->
      </div>

      <!-- Order Summary Card -->
      <aside class="order-summary">
        <h2>Order Summary</h2>
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="summary-subtotal">$0.00</span>
        </div>
        <div class="summary-row">
          <span>Estimated Shipping</span>
          <span id="summary-shipping">Free</span>
        </div>
        <div class="summary-row">
          <span>Tax (5%)</span>
          <span id="summary-tax">$0.00</span>
        </div>
        <hr class="summary-divider" />
        <div class="summary-row total-row">
          <span>Total</span>
          <span id="summary-total">$0.00</span>
        </div>
        <button class="checkout-btn" onclick="window.location.href='http://127.0.0.1:5501/checkout.html'">Proceed to Checkout</button>
      </aside>
    </div>

    <!-- Empty Cart Fallback -->
    <div id="empty-cart" class="empty-state" style="display: none;">
      <i class="fa-solid fa-bag-shopping empty-icon"></i>
      <h2>Your cart is currently empty</h2>
      <p>Looks like you haven't added anything to your cart yet.</p>
      <a href="./product.html" class="browse-btn">Start Shopping</a>
    </div>

    <div class="last">
      <a href="./product.html" class="back-btn">
        <i class="fa-solid fa-arrow-left"></i> Back to Products
      </a>
    </div>
  </div>

  <script src="cart.js"></script>


  
</body>
</html>
