<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Wishlist - ShopEasy</title>
  <link rel="stylesheet" href="product.css" />
  <link rel="stylesheet" href="wishlist.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>

  <header class="navbar">
    <a href="./product.html" class="brand-logo">
      <img src="./Ecommercel_logo.png" alt="ShopEasy Logo" onerror="this.src='https://via.placeholder.com/140x40?text=ShopEasy'">
    </a>
    <div class="nav-actions">
      <a href="./wishlist.html" class="nav-pill active-pill" aria-label="Wishlist">
        <i class="fa-regular fa-heart"></i>
        <span class="pill-label">Wishlist</span>
        <span class="count-badge">0</span>
      </a>
      <a href="./cart.html" class="nav-pill" aria-label="Cart">
        <i class="fa-solid fa-bag-shopping"></i>
        <span class="pill-label">Cart</span>
        <span class="count-badge highlight">0</span>
      </a>
    </div>
  </header>

  <div class="page-container">
    <header class="catalog-header">
      <h1 style="color: brown;">My Saved Wishlist</h1>
    </header>

    <div id="wishlist-grid" class="product-grid">
      <!-- Dynamically generated items -->
    </div>

    <div id="empty-wishlist" class="empty-state" style="display: none;">
      <i class="fa-regular fa-heart empty-icon"></i>
      <h2>Your wishlist is currently empty</h2>
      <p>Save items you love to review and purchase later.</p>
      <a href="./product.html" class="browse-btn">Explore Products</a>
    </div>

    <div class="last">
      <a href="./product.html" class="back-btn" >
        <i class="fa-solid fa-arrow-left"></i> Back to Products
      </a>
    </div>
  </div>

  <script src="wishlist.js"></script>

  
</body>
</html>
