<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Placed - Shop Easy</title>
  <link rel="stylesheet" href="Ecommerce.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #f0fdf4 0%, #f8fafc 50%, #eff6ff 100%);
    }

    .confirmation-card {
      background: #ffffff;
      border-radius: 24px;
      padding: 56px 48px 48px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.1), 0 4px 12px rgba(15, 23, 42, 0.06);
      position: relative;
      overflow: hidden;
      opacity: 0;
      transform: translateY(24px);
      animation: cardEnter 0.6s ease-out forwards;
    }

    /* Soft decorative glow behind the icon */
    .confirmation-card::before {
      content: '';
      position: absolute;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(34, 197, 94, 0.15) 0%, rgba(34, 197, 94, 0) 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    @keyframes cardEnter {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      60% { transform: scale(1.15); opacity: 1; }
      80% { transform: scale(0.95); }
      100% { transform: scale(1); }
    }

    @keyframes ringPulse {
      0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.35); }
      100% { box-shadow: 0 0 0 24px rgba(34, 197, 94, 0); }
    }

    @keyframes checkDraw {
      to { stroke-dashoffset: 0; }
    }

    .success-icon-wrapper {
      position: relative;
      width: 100px;
      height: 100px;
      margin: 0 auto 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      animation: popIn 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
                 ringPulse 1.4s ease-out 0.55s;
    }

    .success-icon-wrapper i {
      font-size: 3rem;
      color: #ffffff;
    }

    .order-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: #0f172a;
      margin: 0 0 10px;
      opacity: 0;
      animation: fadeUp 0.5s ease-out 0.35s forwards;
    }

    .order-subtitle {
      font-size: 0.95rem;
      color: #64748b;
      line-height: 1.6;
      margin: 0 0 8px;
      opacity: 0;
      animation: fadeUp 0.5s ease-out 0.45s forwards;
    }

    .order-id-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #f0fdf4;
      color: #16a34a;
      border: 1px solid #bbf7d0;
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 600;
      margin: 18px 0 30px;
      opacity: 0;
      animation: fadeUp 0.5s ease-out 0.55s forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      opacity: 0;
      animation: fadeUp 0.5s ease-out 0.65s forwards;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: brown;
      color: #ffffff;
      text-decoration: none;
      padding: 14px 24px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-primary:hover {
      background: rgb(170, 73, 73);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.25);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: brown;
      color: #f7f9fc;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.9rem;
      border: 1.5px solid #e2e8f0;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background: rgb(170, 73, 73);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.25);
    }


 

    @media (max-width: 480px) {
      .confirmation-card {
        padding: 40px 24px 32px;
        border-radius: 18px;
      }

      .order-title {
        font-size: 1.4rem;
      }

      .success-icon-wrapper {
        width: 80px;
        height: 80px;
      }

      .success-icon-wrapper i {
        font-size: 2.3rem;
      }
    }
  </style>
</head>
<body>

  <div class="confirmation-card">
    <div class="success-icon-wrapper">
      <i class="fa-solid fa-check"></i>
    </div>

    <h1 class="order-title">Thank You for Your Order!</h1>
    <p class="order-subtitle">Your order has been placed successfully and is being processed.</p>

    <div class="order-id-badge">
      <i class="fa-solid fa-receipt"></i>
      <span id="order-id-display">Order #ORD-000000</span>
    </div>

    <div class="action-buttons">
      <a href="Ecommerce.html" class="btn-primary">
        <i class="fa-solid fa-bag-shopping"></i> Return to Shopping
      </a>
      <a href="orders.html" class="btn-secondary">
        <i class="fa-solid fa-clock-rotate-left"></i> View My Orders
      </a>
    </div>
  </div>

  <script>
  const params = new URLSearchParams(window.location.search);
  const orderId = params.get('orderId');
  if (orderId) {
    document.getElementById('order-id-display').textContent = `Order #${orderId}`;
  } else {
    document.getElementById('order-id-display').textContent = 'Order confirmed';
  }
</script>

</body>
</html>
